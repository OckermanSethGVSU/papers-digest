# Runs scripts/digest.py daily and posts the result to Discord.
name: Daily Vector Search Digest

on:
  schedule:
    - cron: "0 7 * * *" # every day 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate digest
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/digest.py

      - name: Commit and push
        id: commit
        env:
          DIGEST_PATH: ${{ steps.generate.outputs.digest_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          if [ -n "$DIGEST_PATH" ]; then
            git commit -m "digest: $(date -u +%F)"
          else
            git commit -m "digest: update seen papers $(date -u +%F)"
          fi
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: steps.generate.outputs.digest_path != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DIGEST_PATH: ${{ steps.generate.outputs.digest_path }}
          DIGEST_COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping Discord notification"
            exit 0
          fi
          DIGEST_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${DIGEST_COMMIT_SHA}/${DIGEST_PATH}"
          python scripts/notify_discord.py \
            --digest "$DIGEST_PATH" \
            --digest-url "$DIGEST_URL" \
            --webhook-url "$DISCORD_WEBHOOK_URL"
